set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g renumber-windows


#Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dracula/tmux'

# Dracula status bar
set -g @dracula-plugins 'git cwd cpu-usage ram-usage ssh-session time'
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
set -g @dracula-show-empty-plugins false

# Jellybeans palette
set -g @dracula-colors "
white='#e8e8d3'
gray='#4e4e4e'
dark_gray='#303030'
light_purple='#c6b6ee'
dark_purple='#8787af'
cyan='#8fbfdc'
green='#99ad6a'
orange='#ffb964'
red='#cf6a4c'
pink='#f0a0c0'
yellow='#fad07a'
"

set -g @dracula-show-left-icon '#h | #S'

set -g @dracula-military-time true
set -g @dracula-show-timezone true

set -g @dracula-git-show-current-symbol '✓'
set -g @dracula-git-show-diff-symbol '!'
set -g @dracula-git-show-remote-status false
set -g @dracula-git-truncate-length 20

set -g @dracula-cpu-usage-label 'CPU'
set -g @dracula-ram-usage-label 'RAM'

set -g @dracula-cwd-max-chars 24

set -g @dracula-uptime-label '↑'

set -g @dracula-show-ssh-only-when-connected true

set -g @dracula-continuum-mode countdown

# tmux-resurrect 
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
